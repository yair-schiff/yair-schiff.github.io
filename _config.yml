# Site settings. Restart `jekyll serve` after editing this file.
title: Yair Schiff
tagline: Generative modeling for discrete data
description: >-
  Yair Schiff's personal webpage. PhD candidate in Computer Science at Cornell
  working on generative modeling for discrete data.
author: Yair Schiff
email: yairschiff@cs.cornell.edu
cv: /assets/resume/YSResume2026.pdf

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://yair-schiff.github.io"

# Links shown as icons under the intro
profiles:
  scholar: https://scholar.google.com/citations?user=GhFrOdQAAAAJ
  github: https://github.com/yair-schiff
  twitter: https://twitter.com/SchiffYair
  linkedin: https://linkedin.com/in/yair-schiff
  huggingface: https://huggingface.co/yairschiff
  medium: https://yairschiff.medium.com
twitter:
  username: SchiffYair

# Social preview image for every page
logo: /assets/images/profile_picture.jpeg
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile_picture.jpeg

markdown: kramdown
plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
