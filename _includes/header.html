<header class="site-header">
  <div class="header-left">
    <button type="button" class="icon-btn theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="icon-moon" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
    {% unless page.home %}<a class="wordmark" href="{{ '/' | relative_url }}">{{ site.author }}</a>{% endunless %}
  </div>
  <nav class="site-nav" aria-label="Primary">
    <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Blog</a>
    <a href="{{ '/' | relative_url }}#publications">Publications</a>
    <a href="{{ site.cv | relative_url }}">CV</a>
  </nav>
</header>
